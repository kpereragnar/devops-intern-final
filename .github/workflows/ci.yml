
name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:

  # Job 1: Lint application files
  lint:
    name: Lint and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  # Job 2: Build and test Docker image
  build-test:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            -t devops-intern-nginx:test \
            -f app/Dockerfile \
            app/

      - name: Start application container
        run: |
          docker run -d \
            --name devops-nginx-test \
            -p 8080:8080 \
            devops-intern-nginx:test

      - name: Wait for container health
        run: |
          for attempt in $(seq 1 30); do
            STATUS=$(docker inspect \
              --format '{{.State.Health.Status}}' \
              devops-nginx-test)

            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy."
              exit 0
            fi

            echo "Waiting for container health: $STATUS"
            sleep 2
          done

          echo "Container failed to become healthy."
          docker logs devops-nginx-test
          exit 1

      - name: Run application health check
        run: |
          ./scripts/healthcheck.sh http://localhost:8080/healthz

      - name: Verify homepage response
        run: |
          curl --fail --silent --show-error http://localhost:8080/ > /dev/null
          echo "Homepage returned HTTP 200."

      - name: Verify build identifier
        run: |
          PAGE="$(curl --fail --silent http://localhost:8080/)"
          printf '%s\n' "$PAGE" | grep -Fq "${GITHUB_SHA}"
          echo "Build identifier verified: ${GITHUB_SHA}"

      - name: Verify image size
        run: |
          IMAGE_SIZE=$(docker image inspect devops-intern-nginx:test --format '{{.Size}}')
          MAX_SIZE=$((60 * 1024 * 1024))

          echo "Image size: ${IMAGE_SIZE} bytes"

          if [ "$IMAGE_SIZE" -ge "$MAX_SIZE" ]; then
            echo "ERROR: Image exceeds the 60 MB limit."
            exit 1
          fi

          echo "Image size is within the 60 MB limit."

      - name: Cleanup
        if: always()
        run: |
          docker rm -f devops-nginx-test || true

  # Job 3: Publish image to GHCR
  publish:
    name: Publish to GitHub Container Registry
    runs-on: ubuntu-24.04

    needs:
      - lint
      - build-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
